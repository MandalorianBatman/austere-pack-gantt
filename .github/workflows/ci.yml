name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/ is committed so the repo works as a local folder pack; keep it in step with src/.
      - name: dist is up to date
        run: git diff --exit-code -- dist
      - run: npm test
      # Packs the folder, installs the .tgz with --trust, and runs `austere-axi check` on examples/rollout.html.
      - run: npm run check:example
